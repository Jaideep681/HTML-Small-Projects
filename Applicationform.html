<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Application Form</title>
    <link rel="stylesheet" href="Applicationform.css">
    <link rel="website icon" href="IMAGES/JAIDEEP.png" type="png">
</head>
<body>
    <script src="JS FILE/Applicationform.js"></script>
    <div class="applicationform">
        <div class="application">
            <form>
                <div class="user">
                    <span class="name">Full name:</span>
                    <input type="text" class="answer" placeholder="Enter your Fullname" autofocus required>
                </div>
                <div class="user">
                    <span class="name">Username:</span>
                    <input type="text" class="answer" placeholder="Enter your Username">
                </div>
                <div class="user">
                    <span class="name">E-Mail:</span>
                    <input type="mail" class="answer" placeholder="Enter your E-mail" required>
                </div>
                <div class="user">
                    <span class="name">Contact number:</span>
                    <input type="number" class="answer" placeholder="Enter your Contact no." maxlength="10" size="10" required>
                </div>
                <div class="user">
                    <span class="name">10th marksheet:</span>
                    <input type="file" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">12th marksheet:</span>
                    <input type="file" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">Favourite color:</span>
                    <input type="color" class="answer">
                    <select>
                        <option>---Select color---</option>
                        <option>Red</option>
                        <option>Yellow</option>
                        <option>Black</option>
                        <option>Blue</option>
                        <option>Violet</option>
                        <option>Green</option>
                    </select>
                </div>
                <div class="user">
                    <span class="name">Date of Birth:</span>
                    <input type="date" class="answer">
                </div>
                <div class="user">
                    <span class="name">Your experience:</span>
                    <input type="range" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">Time of born:</span>
                    <input type="time" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">Week of submitting data:</span>
                    <input type="week" class="answer">
                </div>
                <div class="user">
                    <span class="name">Password:</span>
                    <input type="password" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">Confirm password:</span>
                    <input type="password" class="answer" required>
                </div>
                <div class="user">
                    <span class="name">Gender:</span>
                    <input type="radio" name="gender" class="answer" required>Male
                    <input type="radio" name="gender" class="answer" required>Female
                </div>
                <div class="user">
                    <span class="name">You fill this form correctly?</span>
                    <input type="checkbox" class="answer" required>Yes
                    <input type="checkbox" class="answer">No
                </div>
                <a href="datasubmission.html"><input type="submit" class="submit"></a>
            </form>
        </div>
    </div>
</body>
</html>
