<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Best Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            color: #fff;
        }

        h1 {
            font-family: algerian;
            display: flex;
            gap: 20px;
        }

        h1 span {
            display: inline-block;
        }

        .rahul h1 span {
            animation: effect 1.4s ease-out infinite;
        }

        .jaideep h1 span {
            animation: effect 1.4s ease-out infinite;
        }

        .rahul h1 span:nth-child(1),
        .jaideep h1 span:nth-child(1) {
            animation-delay: 0s;
        }

        .rahul h1 span:nth-child(2),
        .jaideep h1 span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .rahul h1 span:nth-child(3),
        .jaideep h1 span:nth-child(4) {
            animation-delay: 0.2s;
        }

        .rahul h1 span:nth-child(4),
        .jaideep h1 span:nth-child(4) {
            animation-delay: 0.3s;
        }

        .rahul h1 span:nth-child(5),
        .jaideep h1 span:nth-child(5) {
            animation-delay: 0.4s;
        }

        .jaideep h1 span:nth-child(6) {
            animation-delay: 0.5s;
        }

        .jaideep h1 span:nth-child(7) {
            animation-delay: 0.6s;
        }

        @keyframes effect {
            0%,
            100% {
                transform: translateY(0);
                scale: 1;
                color: white;
            }
            50% {
                transform: translateY(-15px);
                scale: 1.2;
                color: blue;
            }
        }

        .rahul {
            margin-top: -150px;
            cursor: pointer;
        }

        .jaideep {
            margin-left: -213.5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="rahul">
        <h1>
            <span>R</span>
            <span>A</span>
            <span>H</span>
            <span>U</span>
            <span>L</span>
        </h1>
    </div>
    <div class="jaideep">
        <h1>
            <span>J</span>
            <span>A</span>
            <span>I</span>
            <span>D</span>
            <span>E</span>
            <span>E</span>
            <span>P</span>
        </h1>
    </div>
</body>

</html>
