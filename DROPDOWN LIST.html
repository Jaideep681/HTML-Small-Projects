<!Doctype html>
<html lang="en">
<head>
<title>DROPDOWN LIST</title>
<style>
body{
	background-color:tomato;
}
select{
	background-color:green;
	color:white;
	text-align:center;
	width:20%;
	height:1cm;
}
select option{
	background-color:lightgrey;
	color:red;
	text-align:center;
}
</style>
</head>
<body>
<select>
	<option>--Select Class--</option>
	<option>9th</option>
	<option>10th</option>
	<option>11th</option>
	<option>12th</option>
</select>
<select>
	<option>--Select Course--</option>
	<optgroup label="1-Year Course">
	<option>Ethical Hacking</option>
	<optgroup label="2-Year Course">
	<option>MCA</option>
	<option>MBA</option>
	<optgroup label="3-Year Course">
	<option>BCA</option>
	<option>BSc</option>
	<optgroup label="5-Year Course">
	<option>Phd</option>
	<option>B.Tech</option>
</select>
<select>
	<option>--Select Subjects--</option>
	<option>Physics</option>
	<option>Chemistry</option>
	<option>Mathematics</option>
	<option>English</option>
	<option>Informatics Practices</option>
</select>
</body>
</html>
