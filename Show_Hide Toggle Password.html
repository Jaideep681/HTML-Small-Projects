<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Toggle Password</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        label {
            padding-right: 30px;
            position: relative;
        }

        #psd {

            position: absolute;
        }

        #check {
            margin-left: 0px;
            position: relative;
        }

        h1 {
            margin-left: 20px;
            margin-bottom: 150px;
        }
    </style>
</head>

<body>
    <h1 slot="title">Password:</h1>
    <input type="password" id="psd" placeholder="Enter your password">
    <input type="checkbox" id="check" onclick="psd.type=this.checked?'text':'password'">
</body>

</html>
