<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Back to top button</title>
    <style>
        h1{
            text-align: center;
            margin-bottom: 10px;
        }
        p{
            text-align: center;
            margin-bottom: 2000px;
        }
        button{
            margin: 0;
            padding: 7px;
            border-radius: 10px;
            border: 0;
            background-color: aqua;
            color: #fff;
            float: right;
            font-size: 35px;
            margin-bottom: 10px;
        }
        button:active{
            color: #222;
            background-color: #ff0;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <h1>This is a long page</h1>
    <p>Please scroll down...</p>
    <button id="top">&uarr;</button>      <!--&#8593;-->
    <script>
        const btn=document.getElementById("top");
        window.onscroll=()=>{
            btn.style.display=window.scrollY>300?"block":"none";
        }
        btn.onclick=()=>window.scrollTo({
            top: 0, behavior: "smooth"
        });
    </script>
</body>
</html>
