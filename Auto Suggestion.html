<!DOCTYPE html>
<html lang="en">

    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Auto Suggestion</title>
</head>
<body>

        <option value="MCA">MCA</option>

        <option value="M.Tech">M.Tech</option>
        <option value="MBA">MBA</option>
    </datalist>
</body>
</html>
