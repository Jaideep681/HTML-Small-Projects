<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Image Scaling</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 75vh;
        }
        .image {
            width: 300px;
            height: 300px;
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .image img:hover {
            transform: scale(1.8);
        }
        h1{
            margin-bottom: -400px;
            margin-left: -260px;
            text-align: center;
            font-size: 75px;
            background: url("https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg");
            background-size: contain;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div class="image">
        <img src="IMAGES/JAIDEEP.bmp" alt="Jaideep Paul image">
    </div>
    <h1>INDIA</h1>
</body>

</html>
