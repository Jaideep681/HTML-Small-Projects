<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Underlining the text</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 97vh;
        }

        h1 {
            padding: 5px;
            color: blue;
            text-transform: uppercase;
            position: relative;
            font-size: xx-large;
        }

        h1::after {
            content: "";
            background-color: red;
            height: 5px;
            width: max-content;
            position: absolute;
            padding-left: 100%;
            bottom: 0;
            left: 0;
        }

        h1::before{
            content: "";
            background-color: red;
            padding-right: 100%;
            height: 5px;
            width: max-content;
            position: absolute;
            top: 0;
            left: 0;
        }
        h1:hover::after,h1:hover::before{
            animation: text 1s linear 1;
        }
        @keyframes linear{
            0%{
                width: 0%;
            }
            100%{
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1> Jaideep Paul </h1>
</body>

</html>
